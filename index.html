        </svg>

      const MapPinSmall = () => (
        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>

        valparaiso: "https://images.unsplash.com/photo-1541572238-8b2e02cd9d79?auto=format&fit=crop&w=1200&q=80",
        santiago: "https://images.unsplash.com/photo-1547901176-6ab4ca5a8f0f?auto=format&fit=crop&w=1200&q=80",
        rio: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1200&q=80",

        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [activeSection, setActiveSection] = useState('inicio');

        const navItems = [
          { id: 'inicio', label: 'Inicio', link: 'index.html#inicio' },
          { id: 'quienes-somos', label: 'Quiénes Somos', link: 'index.html#quienes-somos' },
          { id: 'areas', label: 'Áreas', link: 'index.html#areas' },
          { id: 'servicios', label: 'Servicios', link: 'servicios.html' },
          { id: 'experiencia', label: 'Experiencia', link: 'servicios.html#experiencia' },
          { id: 'publicaciones', label: 'Publicaciones', link: 'servicios.html#publicaciones' },
          { id: 'profesionales', label: 'Profesionales', link: 'index.html#profesionales' },
          { id: 'contacto', label: 'Contacto', link: 'index.html#contacto' }
        ];

        useEffect(() => {
          const handleScroll = () => {
            const scrollPosition = window.scrollY + 120;
            let current = 'inicio';
            
            const visibleItems = navItems.filter(item => 
              !['servicios', 'experiencia', 'publicaciones'].includes(item.id)
            );
            visibleItems.forEach(item => {
              const element = document.getElementById(item.id);
              if (element) {
                const offsetTop = element.offsetTop;
                const offsetHeight = element.offsetHeight;
                if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                  current = item.id;
                }
              }
            });
            setActiveSection(current);
          };

          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const scrollToSection = (sectionId) => {
          setMobileMenuOpen(false);
          const element = document.getElementById(sectionId);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth' });
          }
        };

                        & Territorio
                      </span>
                    </div>
                  </a>

                        href={item.link}
                        className={`hover:text-slate-900 transition pb-0.5 ${

                      >

                        </a>

                      </a>
                    </div>
                  </div>

                    <div className="bg-slate-900 text-white p-2 border border-slate-800 relative shadow-lg group overflow-hidden">

                        <div className="absolute bottom-3 left-3 right-3 text-white">
