<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Consultores · Desarrollo Sostenible & Territorio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React 18, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              title: ['SF Pro', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
      /* SF Pro para títulos */
      h1, h2, h3, h4, h5, h6,
      .font-title,
      .font-serif,
      [class*="font-serif"] {
        font-family: 'SF Pro', 'Inter', sans-serif !important;
        font-weight: 500 !important;
        letter-spacing: -0.02em;
      }
      
      /* Ajuste para títulos específicos */
      .font-serif.text-4xl,
      .font-serif.text-5xl,
      .font-serif.text-3xl,
      .font-serif.text-2xl,
      .font-serif.text-xl,
      .font-serif.text-lg {
        font-family: 'SF Pro', 'Inter', sans-serif !important;
        font-weight: 500 !important;
      }

      /* Fallback si SF Pro no está disponible */
      @supports not (font-family: 'SF Pro') {
        h1, h2, h3, h4, h5, h6,
        .font-title,
        .font-serif,
        [class*="font-serif"] {
          font-family: 'Inter', sans-serif !important;
          font-weight: 600 !important;
        }
      }
    </style>
</head>
<body class="bg-[#FAF9F6] text-slate-900 font-sans antialiased selection:bg-slate-800 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ======== ICONOS SVG ========
      const ArrowRight = () => (
        <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      );

      const MenuIcon = () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      );

      const CloseIcon = () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      );

      const Compass = () => (
        <svg className="w-8 h-8 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" strokeWidth="1.5"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" strokeWidth="1.5"/>
        </svg>
      );

      const MapPin = () => (
        <svg className="w-8 h-8 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <circle cx="12" cy="11" r="3" strokeWidth="1.5"/>
        </svg>
      );

      const User = () => (
        <svg className="w-8 h-8 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      );

      const BarChart = () => (
        <svg className="w-8 h-8 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      );

      const Mail = () => (
        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      );

      const MapPinSmall = () => (
        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        </svg>
      );

      const Phone = () => (
        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
      );

      const Linkedin = () => (
        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      );

      // ======== IMÁGENES POR ZONA ========
      const images = {
        norte: "https://images.unsplash.com/photo-1542401886-65d6c61db217?auto=format&fit=crop&w=1200&q=80",
        valparaiso: "https://images.unsplash.com/photo-1541572238-8b2e02cd9d79?auto=format&fit=crop&w=1200&q=80",
        santiago: "https://images.unsplash.com/photo-1547901176-6ab4ca5a8f0f?auto=format&fit=crop&w=1200&q=80",
        rio: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1200&q=80",
      };

      // ======== COMPONENTE PRINCIPAL ========
      function App() {
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [activeSection, setActiveSection] = useState('inicio');

        const navItems = [
          { id: 'inicio', label: 'Inicio' },
          { id: 'quienes-somos', label: 'Quiénes Somos' },
          { id: 'areas', label: 'Áreas' },
          { id: 'servicios', label: 'Servicios' },
          { id: 'experiencia', label: 'Experiencia' },
          { id: 'publicaciones', label: 'Publicaciones' },
          { id: 'profesionales', label: 'Profesionales' }
        ];

        useEffect(() => {
          const handleScroll = () => {
            const scrollPosition = window.scrollY + 120;
            let current = 'inicio';
            
            navItems.forEach(item => {
              const element = document.getElementById(item.id);
              if (element) {
                const offsetTop = element.offsetTop;
                const offsetHeight = element.offsetHeight;
                if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                  current = item.id;
                }
              }
            });
            setActiveSection(current);
          };

          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const scrollToSection = (sectionId) => {
          setMobileMenuOpen(false);
          const element = document.getElementById(sectionId);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth' });
          }
        };

        return (
          <div className="min-h-screen bg-[#FAF9F6] text-slate-900">
            
            {/* ===== HEADER CON MENÚ ===== */}
            <header className="fixed top-0 left-0 right-0 z-50 bg-[#FAF9F6]/95 backdrop-blur-md border-b border-slate-200">
              <div className="max-w-7xl mx-auto px-4 sm:px-6">
                <div className="h-20 flex items-center justify-between">
                  
                  {/* Logo */}
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => scrollToSection('inicio')}>
                    <div className="w-9 h-9 bg-emerald-700 text-white flex items-center justify-center font-title text-lg font-bold rounded-sm">
                      DS
                    </div>
                    <div>
                      <span className="font-title text-base font-semibold text-slate-900 tracking-tight block leading-none">
                        DS Consultores
                      </span>
                      <span className="text-[10px] font-medium text-slate-500 tracking-widest uppercase mt-0.5 block">
                        Desarrollo Sostenible & Territorio
                      </span>
                    </div>
                  </div>

                  {/* Menú Desktop */}
                  <nav className="hidden lg:flex items-center gap-6 text-xs font-medium tracking-wide text-slate-600 uppercase">
                    {navItems.map(item => (
                      <button
                        key={item.id}
                        onClick={() => scrollToSection(item.id)}
                        className={`hover:text-slate-900 transition pb-0.5 ${
                          activeSection === item.id ? 'text-slate-900 border-b-2 border-emerald-700 font-semibold' : ''
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </nav>

                  {/* Botón de Contactar */}
                  <div className="flex items-center gap-3">
                    <a 
                      href="#contacto" 
                      className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white text-[10px] uppercase tracking-wider font-semibold rounded-none transition"
                      onClick={(e) => { e.preventDefault(); scrollToSection('contacto'); }}
                    >
                      Contactar
                    </a>
                    <button 
                      onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                      className="lg:hidden p-2 hover:bg-slate-100 rounded-md transition"
                    >
                      {mobileMenuOpen ? <CloseIcon /> : <MenuIcon />}
                    </button>
                  </div>
                </div>

                {/* Menú Móvil */}
                {mobileMenuOpen && (
                  <div className="lg:hidden py-4 border-t border-slate-200 bg-[#FAF9F6]">
                    <div className="flex flex-col gap-2">
                      {navItems.map(item => (
                        <button
                          key={item.id}
                          onClick={() => scrollToSection(item.id)}
                          className={`text-left px-3 py-2 text-xs font-medium uppercase tracking-wider hover:bg-slate-100 transition ${
                            activeSection === item.id ? 'text-slate-900 bg-slate-100 font-semibold' : 'text-slate-600'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                      <a 
                        href="#contacto" 
                        className="mt-2 px-4 py-3 bg-emerald-700 text-white text-center text-xs uppercase tracking-wider font-semibold"
                        onClick={(e) => { e.preventDefault(); scrollToSection('contacto'); }}
                      >
                        Contactar
                      </a>
                    </div>
                  </div>
                )}
              </div>
            </header>

            {/* ===== CONTENIDO PRINCIPAL ===== */}
            <main className="pt-20">
              
              {/* ===== SECCIÓN 1: INICIO (HERO) ===== */}
              <section id="inicio" className="relative border-b border-slate-200 py-20 lg:py-28 bg-white">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 grid lg:grid-cols-12 gap-12 items-center">
                  <div className="lg:col-span-7 space-y-8">
                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-mono">
                      <span className="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
                      Consultoría Especializada • Chile
                    </div>
                    
                    <h1 className="font-title text-4xl sm:text-5xl font-medium leading-[1.12] text-slate-900">
                      Transformando datos socioespaciales en decisiones estratégicas de territorio.
                    </h1>

                    <p className="text-slate-600 text-lg font-light leading-relaxed max-w-2xl">
                      Cruce interdisciplinario de antropología avanzada, etnografía profunda y análisis geoespacial (GIS/Geodatos) para la gestión pública, industrial y ambiental.
                    </p>

                    <div className="flex flex-wrap gap-4 pt-2">
                      <a href="#contacto" className="px-6 py-3.5 bg-emerald-700 text-white text-xs uppercase tracking-widest font-semibold hover:bg-emerald-800 transition flex items-center gap-2 shadow-sm">
                        Solicitar Diagnóstico <ArrowRight />
                      </a>
                      <a href="#experiencia" className="px-6 py-3.5 bg-slate-100 text-slate-800 border border-slate-300 text-xs uppercase tracking-widest font-semibold hover:bg-slate-200 transition">
                        Ver Casos de Estudio
                      </a>
                    </div>
                  </div>

                  {/* Tarjeta Visual - Imagen del Norte */}
                  <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900 text-white p-2 border border-slate-800 relative shadow-lg group overflow-hidden">
                      <div className="relative aspect-[4/3] w-full overflow-hidden bg-slate-800">
                        <img 
                          src={images.norte}
                          alt="San Pedro de Atacama - Territorio y cultura del norte chileno" 
                          className="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-in-out"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                        <div className="absolute bottom-3 left-3 right-3 text-white">
                          <span className="inline-block px-2 py-0.5 bg-emerald-500 text-slate-950 font-mono text-[10px] font-bold uppercase tracking-wider mb-1">
                            Norte de Chile
                          </span>
                          <h4 className="font-title text-sm font-semibold leading-tight text-white">
                            San Pedro de Atacama
                          </h4>
                          <p className="text-[11px] text-slate-300 font-light mt-0.5">
                            Territorio, patrimonio y comunidades ancestrales
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-[#FAF9F6] p-6 border border-slate-200 space-y-4">
                      <h3 className="font-title text-base font-semibold border-b border-slate-200 pb-2 text-slate-900">
                        En Cifras
                      </h3>
                      <div className="grid grid-cols-3 gap-4 text-center">
                        <div>
                          <div className="font-title text-2xl font-bold text-slate-900">15+</div>
                          <div className="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Años Exp.</div>
                        </div>
                        <div>
                          <div className="font-title text-2xl font-bold text-slate-900">40+</div>
                          <div className="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Proyectos</div>
                        </div>
                        <div>
                          <div className="font-title text-2xl font-bold text-slate-900">12</div>
                          <div className="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Regiones</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* ===== SECCIÓN 2: QUIÉNES SOMOS ===== */}
              <section id="quienes-somos" className="py-20 border-b border-slate-200 bg-[#FAF9F6]">
                <div className="max-w-7xl mx-auto px-4 sm:px-6">
                  <div className="grid lg:grid-cols-2 gap-12 items-center">
                    <div className="space-y-6">
                      <span className="text-xs uppercase tracking-widest font-mono text-slate-500">01 / Quiénes Somos</span>
                      <h2 className="font-title text-3xl sm:text-4xl font-medium text-slate-900">
                        Antropología y territorio: nuestro sello
                      </h2>
                      <div className="space-y-4 text-slate-600 text-sm leading-relaxed font-light">
                        <p>
                          Somos una consultora especializada en <span className="font-semibold text-slate-900">Inteligencia Territorial</span>, donde la antropología se encuentra con los geodatos para entender la complejidad de los territorios. Nuestro enfoque interdisciplinario nos permite ir más allá de los mapas y las estadísticas, incorporando la densidad cultural, las dinámicas sociales y las percepciones comunitarias en cada diagnóstico y recomendación.
                        </p>
                        <p>
                          Trabajamos con <span className="font-semibold text-slate-900">gobiernos regionales, empresas privadas, centros de investigación y comunidades</span> para construir soluciones sostenibles que respeten las identidades locales y promuevan el desarrollo equilibrado de los territorios.
                        </p>
                      </div>
                    </div>
                    <div className="relative overflow-hidden rounded-sm">
                      <img 
                        src={images.valparaiso}
                        alt="Valparaíso - Patrimonio y urbanismo" 
                        className="w-full h-[400px] object-cover"
                      />
                      <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900/80 to-transparent p-4">
                        <span className="text-white text-xs font-mono tracking-widest">Valparaíso · Patrimonio y comunidad</span>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* ===== SECCIÓN 3: ÁREAS ===== */}
              <section id="areas" className="py-20 border-b border-slate-200 bg-white">
                <div className="max-w-7xl mx-auto px-4 sm:px-6">
                  <div className="mb-12 border-b border-slate-200 pb-6">
                    <span className="text-xs uppercase tracking-widest font-mono text-slate-500 block mb-2">02 / Áreas de Especialización</span>
                    <h2 className="font-title text-3xl font-medium text-slate-900">Nuestros pilares de trabajo</h2>
                  </div>

                  <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                    <div className="p-8 border border-slate-200 bg-[#FAF9F6] space-y-4 hover:border-emerald-300 transition">
                      <Compass />
                      <h3 className="font-title text-xl font-semibold text-slate-900">Inteligencia Territorial</h3>
                      <p className="text-xs text-slate-600 leading-relaxed font-light">
                        Modelación de datos geoespaciales integrados con variables socio-demográficas para toma de decisiones complejas.
                      </p>
                    </div>

                    <div className="p-8 border border-slate-200 bg-[#FAF9F6] space-y-4 hover:border-emerald-300 transition">
                      <MapPin />
                      <h3 className="font-title text-xl font-semibold text-slate-900">Ordenamiento & PROT</h3>
                      <p className="text-xs text-slate-600 leading-relaxed font-light">
                        Asesoría en Planes Regionales de Ordenamiento Territorial y gestión de cuencas o zonas de conflicto socioambiental.
                      </p>
                    </div>

                    <div className="p-8 border border-slate-200 bg-[#FAF9F6] space-y-4 hover:border-emerald-300 transition">
                      <User />
                      <h3 className="font-title text-xl font-semibold text-slate-900">Etnografía & Comunidades</h3>
                      <p className="text-xs text-slate-600 leading-relaxed font-light">
                        Trabajo de campo en profundidad para evaluación de impacto social, asentamientos y relacionamiento territorial.
                      </p>
                    </div>

                    <div className="p-8 border border-slate-200 bg-[#FAF9F6] space-y-4 hover:border-emerald-300 transition">
                      <BarChart />
                      <h3 className="font-title text-xl font-semibold text-slate-900">Policy Papers & Evidencia</h3>
                      <p className="text-xs text-slate-600 leading-relaxed font-light">
                        Elaboración de informes de políticas públicas, minutas técnicas fundadas para organismos y centros de investigación.
                      </p>
                    </div>
                  </div>

                  {/* Imagen de Santiago */}
                  <div className="mt-12 relative overflow-hidden rounded-sm">
                    <img 
                      src={images.santiago}
                      alt="Santiago - Ciudad y territorio" 
                      className="w-full h-[300px] object-cover"
                    />
                    <div className="absolute inset-0 bg-gradient-to-r from-slate-900/60 to-transparent flex items-center">
                      <div className="p-8 text-white max-w-lg">
                        <span className="text-xs font-mono tracking-widest bg-emerald-600 px-3 py-1 inline-block mb-3">Santiago</span>
                        <h3 className="font-title text-2xl font-medium">Políticas públicas con enfoque territorial</h3>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* ===== SECCIÓN 4: SERVICIOS ===== */}
              <section id="servicios" className="py-20 border-b border-slate-200 bg-[#FAF9F6]">
                <div className="max-w-7xl mx-auto px-4 sm:px-6">
                  <div className="mb-12 border-b border-slate-200 pb-6">
                    <span className="text-xs uppercase tracking-widest font-mono text-slate-500 block mb-2">03 / Servicios</span>
                    <h2 className="font-title text-3xl font-medium text-slate-900">Soluciones concretas para territorios complejos</h2>
                  </div>

                  <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {[
                      { title: "Diagnóstico Socioespacial", desc: "Análisis integral de territorios con enfoque antropológico y geoespacial" },
                      { title: "Evaluación de Impacto Territorial", desc: "Medición de huella social y ambiental de proyectos" },
                      { title: "Planificación Territorial Participativa", desc: "Procesos colaborativos con comunidades y actores locales" },
                      { title: "Modelamiento Geoespacial Cualitativo", desc: "Cruce de datos cuantitativos y cualitativos" },
                      { title: "Asesoría en Políticas Públicas", desc: "Minutas técnicas y recomendaciones para organismos públicos" },
                      { title: "Capacitación y Transferencia", desc: "Formación en metodologías de inteligencia territorial" }
                    ].map((service, index) => (
                      <div key={index} className="p-6 border border-slate-200 bg-white hover:shadow-lg hover:border-emerald-300 transition">
                        <h3 className="font-title text-lg font-semibold text-slate-900">{service.title}</h3>
                        <p className="text-xs text-slate-600 font-light mt-2 leading-relaxed">{service.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
